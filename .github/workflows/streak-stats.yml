name: Update streak stats
on:
  schedule:
    - cron: "0 3 * * *" # Runs daily
  workflow_dispatch: # Allows manual trigger

# Add this block to give the GITHUB_TOKEN write access
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=1919-14&theme=dark&background=0A101F&ring=7C3AED&fire=10B981&currStreakLabel=E5E9F5
          path: profile/streak.svg
      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
